<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Black Friday encerrada · Upward Academy</title>
<!-- 16/11/2026 (dono): a Black acabou em 15/11. /black, /black-vendas e /black-alunos redirecionam para cá
     (vercel.json); as páginas continuam no repositório. Para reabrir, tirar esses redirecionamentos. -->
<style>
  :root { --bg: #050507; --fg: #f6f4f8; --pink: #ff0097; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(60% 50% at 50% 40%, rgba(255, 0, 151, .14), transparent 70%), var(--bg);
    color: var(--fg); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 24px 16px; text-align: center;
  }
  .selo {
    display: inline-block; padding: 6px 12px; border: 1px solid rgba(255, 0, 151, .5); border-radius: 999px;
    color: var(--pink); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600;
  }
  h1 { margin-top: 20px; font-size: clamp(40px, 9vw, 88px); line-height: 1; letter-spacing: -.03em; font-weight: 700; }
  p { margin-top: 16px; font-size: clamp(16px, 2.4vw, 20px); color: rgba(246, 244, 248, .7); }
</style>
</head>
<body>
  <main>
    <span class="selo">Black Friday Upward</span>
    <h1>Encerrada</h1>
    <p>A oferta terminou em 15/11.</p>
  </main>
</body>
</html>
